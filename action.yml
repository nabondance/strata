name: Strata PR context delta
description: Compare Git-tracked agent configuration at two commits, write a token delta to the job summary, and optionally check token limits.
inputs:
  base:
    description: Full Git commit ID for the PR base.
    required: true
  head:
    description: Full Git commit ID for the PR head.
    required: true
  tokenizer:
    description: Offline token mode (estimate, openai-cl100k_base, or openai-o200k_base).
    required: false
    default: estimate
  model:
    description: Named OpenAI model; when set, this takes precedence over the default tokenizer input.
    required: false
    default: ''
  precise:
    description: >-
      Set to 'true' to add precise per-provider totals. Claude and Gemini instruction text is sent to
      their token-count APIs when ANTHROPIC_API_KEY, GEMINI_API_KEY, or GOOGLE_API_KEY is in the step's
      environment, or to Vertex AI when the job has a signed-in gcloud with a project (Claude only
      without ANTHROPIC_API_KEY). A provider with neither falls back to the estimate. Codex is counted
      locally with gpt-5; the tokenizer and model inputs are not used with precise.
    required: false
    default: 'false'
  max-tokens:
    description: >-
      Limit on the stored instructional text at the head, in tokens. Off when empty.
    required: false
    default: ''
  max-increase:
    description: >-
      Limit on the growth of stored instructional text from base to head, in tokens or as a
      percentage such as 10%. Off when empty.
    required: false
    default: ''
  max-up-front-tokens:
    description: >-
      Limit on what each agent reads at session start at the head, in tokens. Give one number for
      every agent, or agent=number entries separated by spaces or commas, such as 'claude=8000
      codex=6000'. Off when empty.
    required: false
    default: ''
  max-up-front-increase:
    description: >-
      Limit on the growth of what each agent reads at session start, in tokens or as a percentage,
      in the same form as max-up-front-tokens. Off when empty.
    required: false
    default: ''
  on-exceed:
    description: >-
      What a limit that is passed does: 'fail' fails the step after writing the summary, 'warn' adds
      a warning and lets the step pass. Used only when a limit is set.
    required: false
    default: fail
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'
    # Installed with npm rather than pnpm/action-setup so the Action only
    # depends on GitHub-owned actions and runs under a restrictive policy.
    - name: Build Strata
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install --global pnpm@10.29.3
        pnpm install --frozen-lockfile
        pnpm build
    - name: Compare PR commits
      shell: bash
      env:
        STRATA_BASE: ${{ inputs.base }}
        STRATA_HEAD: ${{ inputs.head }}
        STRATA_TOKENIZER: ${{ inputs.tokenizer }}
        STRATA_MODEL: ${{ inputs.model }}
        STRATA_PRECISE: ${{ inputs.precise }}
        STRATA_MAX_TOKENS: ${{ inputs.max-tokens }}
        STRATA_MAX_INCREASE: ${{ inputs.max-increase }}
        STRATA_MAX_UP_FRONT_TOKENS: ${{ inputs.max-up-front-tokens }}
        STRATA_MAX_UP_FRONT_INCREASE: ${{ inputs.max-up-front-increase }}
        STRATA_ON_EXCEED: ${{ inputs.on-exceed }}
      run: |
        args=(diff "$GITHUB_WORKSPACE" --base "$STRATA_BASE" --head "$STRATA_HEAD" --output "$RUNNER_TEMP/strata-pr-delta.md")
        if [ "$STRATA_PRECISE" = "true" ]; then
          if [ -n "$STRATA_MODEL" ] || [ "$STRATA_TOKENIZER" != "estimate" ]; then
            echo "::warning::The tokenizer and model inputs are not used with precise: 'true'."
          fi
          # Precise counts accompany the estimate; the runner's cache would not outlive the job.
          args+=(--precise --no-cache)
        elif [ -n "$STRATA_MODEL" ]; then
          args+=(--model "$STRATA_MODEL")
        else
          args+=(--tokenizer "$STRATA_TOKENIZER")
        fi
        # Each input holds one value or several separated by spaces or commas; set -f keeps them literal.
        limits=()
        set -f
        for value in ${STRATA_MAX_TOKENS//,/ }; do limits+=(--max-tokens "$value"); done
        for value in ${STRATA_MAX_INCREASE//,/ }; do limits+=(--max-increase "$value"); done
        for value in ${STRATA_MAX_UP_FRONT_TOKENS//,/ }; do limits+=(--max-up-front-tokens "$value"); done
        for value in ${STRATA_MAX_UP_FRONT_INCREASE//,/ }; do limits+=(--max-up-front-increase "$value"); done
        set +f
        # With a limit set, Strata annotates each limit passed (as an error, or a warning under
        # on-exceed: warn) and each it could not check, and validates on-exceed itself.
        if [ "${#limits[@]}" -gt 0 ]; then args+=("${limits[@]}" --on-exceed "$STRATA_ON_EXCEED" --annotations); fi
        # Status 3 means a limit was passed under on-exceed: fail; the summary is written either way.
        # A file from an earlier run of the Action in the same job must not reach this summary.
        rm -f "$RUNNER_TEMP/strata-pr-delta.md"
        status=0
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" || status=$?
        if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
        cat "$RUNNER_TEMP/strata-pr-delta.md" >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
