name: Strata PR context delta
description: Compare Git-tracked agent configuration at two commits and write a token delta to the job summary.
inputs:
  base:
    description: Full Git commit ID for the PR base.
    required: true
  head:
    description: Full Git commit ID for the PR head.
    required: true
  tokenizer:
    description: Offline token mode (estimate, openai-cl100k_base, or openai-o200k_base).
    required: false
    default: estimate
  model:
    description: Named OpenAI model; when set, this takes precedence over the default tokenizer input.
    required: false
    default: ''
  precise:
    description: >-
      Set to 'true' to add precise per-provider totals. Claude and Gemini instruction text is sent to
      their token-count APIs when ANTHROPIC_API_KEY, GEMINI_API_KEY, or GOOGLE_API_KEY is in the step's
      environment, or to Vertex AI when the job has a signed-in gcloud with a project (Claude only
      without ANTHROPIC_API_KEY). A provider with neither falls back to the estimate. Codex is counted
      locally with gpt-5; the tokenizer and model inputs are not used with precise.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'
    # Installed with npm rather than pnpm/action-setup so the Action only
    # depends on GitHub-owned actions and runs under a restrictive policy.
    - name: Build Strata
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install --global pnpm@10.29.3
        pnpm install --frozen-lockfile
        pnpm build
    - name: Compare PR commits
      shell: bash
      env:
        STRATA_BASE: ${{ inputs.base }}
        STRATA_HEAD: ${{ inputs.head }}
        STRATA_TOKENIZER: ${{ inputs.tokenizer }}
        STRATA_MODEL: ${{ inputs.model }}
        STRATA_PRECISE: ${{ inputs.precise }}
      run: |
        args=(diff "$GITHUB_WORKSPACE" --base "$STRATA_BASE" --head "$STRATA_HEAD" --output "$RUNNER_TEMP/strata-pr-delta.md")
        if [ "$STRATA_PRECISE" = "true" ]; then
          if [ -n "$STRATA_MODEL" ] || [ "$STRATA_TOKENIZER" != "estimate" ]; then
            echo "::warning::The tokenizer and model inputs are not used with precise: 'true'."
          fi
          # Precise counts accompany the estimate; the runner's cache would not outlive the job.
          args+=(--precise --no-cache)
        elif [ -n "$STRATA_MODEL" ]; then
          args+=(--model "$STRATA_MODEL")
        else
          args+=(--tokenizer "$STRATA_TOKENIZER")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
        cat "$RUNNER_TEMP/strata-pr-delta.md" >> "$GITHUB_STEP_SUMMARY"
