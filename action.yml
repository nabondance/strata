name: Strata PR context delta
description: Compare Git-tracked agent configuration at two commits and write a token delta to the job summary.
inputs:
  base:
    description: Full Git commit ID for the PR base.
    required: true
  head:
    description: Full Git commit ID for the PR head.
    required: true
  tokenizer:
    description: Offline token mode (estimate, openai-cl100k_base, or openai-o200k_base).
    required: false
    default: estimate
  model:
    description: Named OpenAI model; when set, this takes precedence over the default tokenizer input.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'
    # Installed with npm rather than pnpm/action-setup so the Action only
    # depends on GitHub-owned actions and runs under a restrictive policy.
    - name: Build Strata
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install --global pnpm@10.29.3
        pnpm install --frozen-lockfile
        pnpm build
    - name: Compare PR commits
      shell: bash
      env:
        STRATA_BASE: ${{ inputs.base }}
        STRATA_HEAD: ${{ inputs.head }}
        STRATA_TOKENIZER: ${{ inputs.tokenizer }}
        STRATA_MODEL: ${{ inputs.model }}
      run: |
        if [ -n "$STRATA_MODEL" ]; then
          node "$GITHUB_ACTION_PATH/dist/cli.js" diff "$GITHUB_WORKSPACE" --base "$STRATA_BASE" --head "$STRATA_HEAD" --model "$STRATA_MODEL" --output "$RUNNER_TEMP/strata-pr-delta.md"
        else
          node "$GITHUB_ACTION_PATH/dist/cli.js" diff "$GITHUB_WORKSPACE" --base "$STRATA_BASE" --head "$STRATA_HEAD" --tokenizer "$STRATA_TOKENIZER" --output "$RUNNER_TEMP/strata-pr-delta.md"
        fi
        cat "$RUNNER_TEMP/strata-pr-delta.md" >> "$GITHUB_STEP_SUMMARY"
