name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify release tag matches package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Pack and smoke test the release artifact
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/strata-pack"
          install_dir="$RUNNER_TEMP/strata-install"
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          mkdir -p "$pack_dir" "$install_dir"
          pnpm pack --pack-destination "$pack_dir"
          tarball="$pack_dir/$package_name-$package_version.tgz"
          npm install --prefix "$install_dir" "$tarball"
          "$install_dir/node_modules/.bin/strata" --version
          "$install_dir/node_modules/.bin/strata" --help
          "$install_dir/node_modules/.bin/strata" skill --output "$RUNNER_TEMP/strata-skill.md"
          test -s "$RUNNER_TEMP/strata-skill.md"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
        id: pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: npm-release-tarball
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Publish verified tarball with trusted publishing
        run: npm publish release/*.tgz --access public
