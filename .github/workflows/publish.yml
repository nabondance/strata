name: Publish to npm

on:
  push:
    tags:
      # Release tags only, not the moving major tag (v0) the Action is used by.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify release tag matches package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Pack and smoke test the release artifact
        id: pack
        run: |
          set -euo pipefail
          node scripts/smoke-package.mjs --pack-destination "$RUNNER_TEMP/strata-pack" | tee "$RUNNER_TEMP/smoke.log"
          echo "tarball=$(tail -n 1 "$RUNNER_TEMP/smoke.log")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: npm-release-tarball
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Publish verified tarball with trusted publishing
        run: npm publish ./release/*.tgz --access public

  # Runs the released Action by name once npm serves the tarball it installs,
  # which can take minutes after publishing. Like this workflow, it has to be
  # started explicitly, and only for the latest release, once v0 points at it.
  test-published-action:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Start the published Action test
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is not the latest release ($latest), so v0 does not point at it and the test is not started."
            exit 0
          fi
          for attempt in $(seq 1 40); do
            if npm pack "context-strata@${TAG#v}" --pack-destination "$RUNNER_TEMP" >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 40 ]; then echo "::warning::npm still does not serve context-strata@${TAG#v}; starting the test anyway."; fi
            sleep 15
          done
          # The release workflow moves v0 and only warns when it cannot.
          release="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          major="$(gh api "repos/$GH_REPO/commits/${TAG%%.*}" --jq .sha)"
          if [ "$major" != "$release" ]; then
            echo "::error::${TAG%%.*} is at $major, not $TAG ($release), so nabondance/strata@${TAG%%.*} does not run this release. Move it, then run published-action.yml by hand."
            exit 1
          fi
          gh workflow run published-action.yml --ref "$TAG"
