name: Publish to npm

on:
  push:
    tags:
      # Release tags only, not the moving major tag (v0) the Action is used by.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify release tag matches package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Pack and smoke test the release artifact
        id: pack
        run: |
          set -euo pipefail
          node scripts/smoke-package.mjs --pack-destination "$RUNNER_TEMP/strata-pack" | tee "$RUNNER_TEMP/smoke.log"
          echo "tarball=$(tail -n 1 "$RUNNER_TEMP/smoke.log")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-release-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-release-tarball
          path: release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Publish verified tarball with trusted publishing
        run: npm publish ./release/*.tgz --access public
