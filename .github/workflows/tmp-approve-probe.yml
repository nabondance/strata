name: Temporary approve probe

# Throwaway: checks whether GITHUB_TOKEN with actions: write may call the
# approve endpoint. It targets a finished run, so nothing is approved.
on:
  pull_request:

permissions:
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh api -X POST "repos/${{ github.repository }}/actions/runs/40106541595/approve" -i 2>&1 | head -20 || true
