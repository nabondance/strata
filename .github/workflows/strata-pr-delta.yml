name: Agent context delta

on:
  pull_request:

permissions:
  contents: read

# Strata's own pull-request delta, run with the Action from this checkout so
# the summary reflects the code under review. Other repositories pin a release
# tag instead: see docs/pr-action.md. It runs as a new user's workflow would:
# a default shallow checkout and no base or head, so each pull request also
# tests that the Action finds and fetches the commits it compares.
jobs:
  strata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
