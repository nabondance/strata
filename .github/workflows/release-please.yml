name: Release PR

# Runs after CI passes on a main commit, so the release PR only moves forward
# from green commits, and a release is tagged only on a release commit whose
# own CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # CI on main runs on a push, or by hand to recover from a failed run.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    uses: ./.github/workflows/main-gate.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  release-please:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_PLEASE_VERSION: 17.11.2
    steps:
      # Two things can happen here. Updating the release PR reads main as it is
      # now, so it needs main to still be at the checked commit. Tagging a merged
      # release PR needs CI to have passed on its own merge commit, which may be
      # older than main: when that commit's CI finishes after a newer commit's,
      # its run comes here only to tag.
      - name: Decide what to do
        id: plan
        env:
          CURRENT: ${{ needs.gate.outputs.current }}
        run: |
          set -euo pipefail
          sha="$(gh pr list --state merged --base main --label 'autorelease: pending' --json mergeCommit --jq '.[0].mergeCommit.oid // empty')"
          tag=false
          if [ -n "$sha" ] && { [ "$CURRENT" = true ] || [ "$sha" = "$CHECKED_SHA" ]; }; then
            state="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&per_page=1" --jq '.workflow_runs[0] | if . == null then "not started" elif .status != "completed" then "still running" else .conclusion end')"
            if [ "$state" = success ]; then
              tag=true
            else
              echo "::warning::CI on the release commit $sha is $state, so the release is not tagged yet. It is tagged when CI on that commit passes; re-run it if it failed."
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "update=$CURRENT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.plan.outputs.tag == 'true' || steps.plan.outputs.update == 'true'
        with:
          ref: ${{ env.CHECKED_SHA }}
      - uses: actions/setup-node@v7
        if: steps.plan.outputs.tag == 'true' || steps.plan.outputs.update == 'true'
        with:
          node-version: 24
      # The repository only allows GitHub-maintained actions, so run the
      # release-please CLI instead of googleapis/release-please-action.
      - name: Create the GitHub release for a merged release PR
        if: steps.plan.outputs.tag == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          existed=false
          if gh release view "$tag" >/dev/null 2>&1; then existed=true; fi
          npx --yes "release-please@$RELEASE_PLEASE_VERSION" github-release \
            --token "$GH_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json
          created=false
          if [ "$existed" = false ] && gh release view "$tag" >/dev/null 2>&1; then created=true; fi
          published=false
          if npm view "$name@$version" version >/dev/null 2>&1; then published=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Open or update the release PR
        if: steps.plan.outputs.update == 'true'
        run: |
          npx --yes "release-please@$RELEASE_PLEASE_VERSION" release-pr \
            --token "$GH_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json
      # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so start
      # the publish workflow explicitly on the new tag.
      - name: Start the npm publish workflow
        if: steps.release.outputs.created == 'true' && steps.release.outputs.published == 'false'
        run: gh workflow run publish.yml --ref "${{ steps.release.outputs.tag }}"
      # Workflows can use the Action as nabondance/strata@v0, so point that tag
      # at the latest release. Tags created with GITHUB_TOKEN start no workflow,
      # and publish.yml only runs for vX.Y.Z tags in any case.
      - name: Move the major version tag
        if: steps.release.outcome == 'success'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # The release is already out, so any failure here only warns, as canary.yml does for its
          # tag; do not let the default `bash -e` end the step.
          set +e -uo pipefail
          major="${TAG%%.*}"
          warn() {
            echo "::warning::$1 nabondance/strata@$major does not run $TAG until it is moved: gh api -X PATCH repos/$GH_REPO/git/refs/tags/$major -f sha=<commit of $TAG> -F force=true (or POST repos/$GH_REPO/git/refs -f ref=refs/tags/$major if it does not exist)."
            exit 0
          }
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" || warn "Could not read the latest release."
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is not the latest release ($latest), so $major stays where it is."
            exit 0
          fi
          sha="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then warn "Could not read the commit of $TAG."; fi
          if current="$(gh api "repos/$GH_REPO/git/ref/tags/$major" --jq .object.sha 2>/dev/null)"; then
            if [ "$current" != "$sha" ]; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$major" -f sha="$sha" -F force=true >/dev/null ||
                warn "Could not move $major to $TAG ($sha)."
            fi
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha" >/dev/null ||
              warn "Could not create $major at $TAG ($sha)."
          fi
          echo "$major points at $TAG ($sha)."
      # The release PR's commits come from GITHUB_TOKEN, so its pull_request
      # workflows wait for approval as `action_required`. Copies started by hand
      # pass on the same commit but do not count toward the pull request's
      # required checks, so approve the waiting runs themselves. Runs appear a
      # few seconds after a push, and release-please editing the title starts
      # another title check, so keep approving until CI and the title check have
      # started and nothing new has waited for a minute. This step comes last,
      # so it never holds up tagging or publishing; if it fails, the run fails
      # with a warning that says how to approve by hand.
      - name: Approve the release PR's own checks
        # Also after a failed earlier step, such as starting publish, since an
        # update may already have pushed to the release PR.
        if: ${{ !cancelled() && steps.plan.outputs.update == 'true' }}
        run: |
          # Errors are handled below, so do not let the default `bash -e` end the step.
          set +e -uo pipefail
          warn() {
            echo "::warning::$1 The release PR stays blocked until its waiting runs are approved: gh api -X POST repos/$GH_REPO/actions/runs/<id>/approve for each of its runs marked action_required."
          }
          if ! branch="$(gh pr list --state open --base main --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // empty')"; then
            warn "Could not look up the release PR."
            exit 1
          fi
          if [ -z "$branch" ]; then exit 0; fi
          head="$(gh api "repos/$GH_REPO/branches/$branch" --jq .commit.sha)"
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            warn "Could not read the release branch $branch."
            exit 1
          fi
          # Only this repository's release branch: a fork's pull request can share the commit.
          # shellcheck disable=SC2016 # $branch and $repo are jq variables.
          select='.workflow_runs[] | select(.head_branch == $branch and .head_repository.full_name == $repo)'
          declare -A refused=()
          quiet=0
          # Every 10 seconds for up to five minutes.
          for _ in $(seq 1 30); do
            if ! listing="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" |
              jq -r --arg branch "$branch" --arg repo "$GH_REPO" "$select"' | "\(.id) \(.conclusion) \(.path)"')"; then
              quiet=0
              sleep 10
              continue
            fi
            waiting="$(awk '$2 == "action_required" { print $1 }' <<<"$listing")"
            for id in $waiting; do
              if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then
                echo "Approved run $id"
              # Another run of this workflow may have approved it first; otherwise retry.
              elif [ "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .conclusion)" = action_required ]; then
                refused[$id]=$(( ${refused[$id]:-0} + 1 ))
                if [ "${refused[$id]}" -ge 3 ]; then
                  warn "GitHub refused three times to approve run $id on $head."
                  exit 1
                fi
              fi
            done
            required="$(awk '$3 ~ /\/(ci|pr-title)\.yml$/ { print $3 }' <<<"$listing" | sort -u | wc -l | tr -d ' ')"
            if [ -z "$waiting" ] && [ "$required" = 2 ]; then
              quiet=$((quiet + 1))
              # A title check from release-please's edit can come after the push's runs.
              if [ "$quiet" -ge 6 ]; then
                echo "CI and the title check run on $head."
                exit 0
              fi
            else
              quiet=0
            fi
            sleep 10
          done
          warn "CI and the title check did not both start and get approved on $head within five minutes."
          exit 1
