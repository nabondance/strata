name: Release PR

# Runs after CI passes on a main commit, so the release PR only moves forward
# from green commits, and a release is tagged only on a release commit whose
# own CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # release-please reads main as it is now. When main has moved past the commit
  # CI checked, the newer commit's CI run starts this workflow again.
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Check that main is still at the checked commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$main" = "$CHECKED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $main, not the checked $CHECKED_SHA; leaving this to the newer CI run"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PLEASE_VERSION: 17.11.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKED_SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      # release-please tags the release PR's merge commit, which can be older
      # than the checked commit. Tag it only if CI passed on that commit itself.
      - name: Check CI on the merged release commit
        id: pending
        run: |
          set -euo pipefail
          sha="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --label 'autorelease: pending' --json mergeCommit --jq '.[0].mergeCommit.oid // empty')"
          ready=true
          if [ -n "$sha" ]; then
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')"
            if [ "$conclusion" != success ]; then
              echo "::warning::CI on the release commit $sha is $conclusion, so the release is not tagged. Re-run CI on that commit, then run this workflow from main."
              ready=false
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      # The repository only allows GitHub-maintained actions, so run the
      # release-please CLI instead of googleapis/release-please-action.
      - name: Create the GitHub release for a merged release PR
        if: steps.pending.outputs.ready == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          existed=false
          if gh release view "$tag" >/dev/null 2>&1; then existed=true; fi
          npx --yes "release-please@$RELEASE_PLEASE_VERSION" github-release \
            --token "$GH_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json
          created=false
          if [ "$existed" = false ] && gh release view "$tag" >/dev/null 2>&1; then created=true; fi
          published=false
          if npm view "$name@$version" version >/dev/null 2>&1; then published=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Open or update the release PR
        run: |
          npx --yes "release-please@$RELEASE_PLEASE_VERSION" release-pr \
            --token "$GH_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json
      # Changes pushed with GITHUB_TOKEN do not trigger pull_request workflows,
      # so start the required checks on the release PR's branch directly.
      - name: Run the required checks on the release PR
        run: |
          set -euo pipefail
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // empty')"
          if [ -n "$branch" ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          fi
      # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so start
      # the publish workflow explicitly on the new tag.
      - name: Start the npm publish workflow
        if: steps.release.outputs.created == 'true' && steps.release.outputs.published == 'false'
        run: gh workflow run publish.yml --ref "${{ steps.release.outputs.tag }}"
