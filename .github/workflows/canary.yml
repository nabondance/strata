name: Canary

# Keeps one rolling `canary` prerelease on GitHub with a tarball of the latest
# green main commit. It is published to GitHub, not npm, so npm's version list
# holds only real releases; npm versions are permanent and every build would add
# one. Install with:
#   npm install --global https://github.com/nabondance/strata/releases/download/canary/context-strata.tgz
# Replacing the tarball needs the repository's "immutable releases" setting off.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # An older commit must not replace a newer canary. When main has moved on,
  # the newer commit's CI run starts this workflow again.
  gate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Check that main is still at the checked commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$main" = "$CHECKED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $main, not the checked $CHECKED_SHA; leaving this to the newer CI run"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  canary:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    # Runs one at a time and never cancels a running build. A newer commit's
    # run waits and replaces any older run still waiting.
    concurrency:
      group: canary
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKED_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - name: Set the canary version
        id: version
        run: |
          set -euo pipefail
          # A canary sorts after the current release and before the next one:
          # 0.4.1 on main becomes 0.4.2-canary.<commit time UTC>.g<short sha>.
          version="$(node -p 'require("./package.json").version')"
          IFS=. read -r major minor patch <<< "${version%%[-+]*}"
          stamp="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          canary="$major.$minor.$((patch + 1))-canary.$stamp.g$(git rev-parse --short=7 HEAD)"
          npm version "$canary" --no-git-tag-version >/dev/null
          echo "version=$canary" >> "$GITHUB_OUTPUT"
      - name: Pack and smoke test the canary
        run: |
          set -euo pipefail
          node scripts/smoke-package.mjs --pack-destination "$RUNNER_TEMP/strata-pack" | tee "$RUNNER_TEMP/smoke.log"
          # A fixed asset name keeps the download URL the same for every canary.
          cp "$(tail -n 1 "$RUNNER_TEMP/smoke.log")" "$RUNNER_TEMP/context-strata.tgz"
      - name: Replace the canary release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/canary/context-strata.tgz"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Rolling build of the latest \`main\` commit that passed CI. It is replaced on every push to \`main\` and is not published to npm.

          - Version: \`$VERSION\`
          - Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$CHECKED_SHA

          \`\`\`sh
          npm install --global $url
          \`\`\`

          Run the same command again to update. Its report format can change before the next release.
          EOF
          if ! gh release view canary >/dev/null 2>&1; then
            git tag --force canary "$CHECKED_SHA"
            git push --force origin refs/tags/canary
            gh release create canary --verify-tag --prerelease --latest=false --title "Canary $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # Upload under a temporary name, then swap it in, so the download URL
          # keeps serving the previous build until the new one is fully uploaded.
          cp "$RUNNER_TEMP/context-strata.tgz" "$RUNNER_TEMP/context-strata.next.tgz"
          gh release upload canary "$RUNNER_TEMP/context-strata.next.tgz" --clobber
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/canary" --jq '.assets[] | "\(.name) \(.id)"')"
          old="$(awk '$1 == "context-strata.tgz" { print $2 }' <<< "$assets")"
          new="$(awk '$1 == "context-strata.next.tgz" { print $2 }' <<< "$assets")"
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new" -f name=context-strata.tgz >/dev/null
          # Point the release at the new commit only once it serves that build.
          # Moving the tag, rather than recreating the release, avoids notifying
          # watchers of a new release on every push.
          git tag --force canary "$CHECKED_SHA"
          git push --force origin refs/tags/canary
          gh release edit canary --prerelease --latest=false --title "Canary $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
