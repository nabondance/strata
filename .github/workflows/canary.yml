name: Canary

# Keeps one rolling `canary` prerelease on GitHub with a tarball of the latest
# green main commit. It is published to GitHub, not npm, so npm's version list
# holds only real releases; npm versions are permanent and every build would add
# one. Install with:
#   npm install --global https://github.com/nabondance/strata/releases/download/canary/context-strata.tgz
# Replacing the tarball needs the repository's "immutable releases" setting off.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # CI on main runs on a push, or by hand to recover from a failed run.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    uses: ./.github/workflows/main-gate.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  # Installs, builds, and smoke-tests with a read-only token; only the release
  # job below can write, and it runs no project code.
  build:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - name: Set the canary version
        id: version
        run: |
          set -euo pipefail
          # A canary sorts after the current release and before the next one:
          # 0.4.1 on main becomes 0.4.2-canary.<commit time UTC>.g<short sha>.
          version="$(node -p 'require("./package.json").version')"
          IFS=. read -r major minor patch <<< "${version%%[-+]*}"
          stamp="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)"
          canary="$major.$minor.$((patch + 1))-canary.$stamp.g$(git rev-parse --short=7 HEAD)"
          npm version "$canary" --no-git-tag-version >/dev/null
          echo "version=$canary" >> "$GITHUB_OUTPUT"
      - name: Pack and smoke test the canary
        run: |
          set -euo pipefail
          node scripts/smoke-package.mjs --pack-destination "$RUNNER_TEMP/strata-pack" | tee "$RUNNER_TEMP/smoke.log"
          # The release asset is uploaded under a temporary name, then renamed.
          mkdir -p "$RUNNER_TEMP/canary"
          cp "$(tail -n 1 "$RUNNER_TEMP/smoke.log")" "$RUNNER_TEMP/canary/context-strata.next.tgz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: canary-tarball
          path: ${{ runner.temp }}/canary/context-strata.next.tgz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    # Runs one at a time and never cancels a running update. A newer commit's
    # run waits and replaces any older run still waiting.
    concurrency:
      group: canary
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: canary-tarball
          path: canary
      - name: Replace the canary release
        run: |
          set -euo pipefail
          # Builds run in parallel, so check again that this is still the newest
          # commit before replacing anything.
          main="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$main" != "$CHECKED_SHA" ]; then
            echo "main moved to $main while $CHECKED_SHA was building; leaving the canary to the newer run"
            exit 0
          fi
          url="https://github.com/$GH_REPO/releases/download/canary/context-strata.tgz"
          cat > notes.md <<EOF
          Rolling build of the latest \`main\` commit that passed CI. It is replaced on every push to \`main\` and is not published to npm.

          - Version: \`$VERSION\`
          - Commit: $GITHUB_SERVER_URL/$GH_REPO/commit/$CHECKED_SHA

          \`\`\`sh
          npm install --global $url
          \`\`\`

          Run the same command again to update. Its report format can change before the next release.
          EOF
          if ! found="$(gh api "repos/$GH_REPO/releases/tags/canary" 2>&1)"; then
            if ! grep -q "HTTP 404" <<< "$found"; then
              echo "$found" >&2
              exit 1
            fi
            gh release create canary --target "$CHECKED_SHA" --prerelease --latest=false --title "Canary $VERSION" --notes-file notes.md
          fi
          # Upload under a temporary name, then swap it in, so the download URL
          # is missing only between the delete and the rename, about a second.
          gh release upload canary canary/context-strata.next.tgz --clobber
          assets="$(gh api "repos/$GH_REPO/releases/tags/canary" --jq '.assets[] | "\(.name) \(.id)"')"
          old="$(awk '$1 == "context-strata.tgz" { print $2 }' <<< "$assets")"
          new="$(awk '$1 == "context-strata.next.tgz" { print $2 }' <<< "$assets")"
          if [ -n "$old" ]; then gh api -X DELETE "repos/$GH_REPO/releases/assets/$old"; fi
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/$GH_REPO/releases/assets/$new" -f name=context-strata.tgz >/dev/null; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          gh release edit canary --prerelease --latest=false --title "Canary $VERSION" --notes-file notes.md
          # Moving the tag, rather than recreating the release, avoids notifying
          # watchers on every push. The notes already name the commit, so a
          # refused move only leaves the tag behind.
          if ! gh api -X PATCH "repos/$GH_REPO/git/refs/tags/canary" -f sha="$CHECKED_SHA" -F force=true >/dev/null; then
            echo "::warning::Could not move the canary tag to $CHECKED_SHA; the release serves the new build, but its tag still points at the previous commit."
          fi
