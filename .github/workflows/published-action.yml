name: Published Action

# Runs the released Action the way another repository does: by name, from the
# release tags, not from this checkout (strata-pr-delta.yml and
# action-smoke.yml cover the code under review with `uses: ./`). The publish
# workflow starts it on each new latest release once npm serves the package. It
# also runs weekly to catch runner changes, by hand, and on pull requests that
# change it. A release Action takes Strata from npm, so this is the workflow
# that checks that path.
on:
  pull_request:
    paths: [.github/workflows/published-action.yml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A new repository with no Strata source: first without agent configuration,
  # then with a CLAUDE.md and an AGENTS.md added, as in the README's setup.
  new-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Make a small repository
        id: repo
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet --initial-branch=main
          git config user.name "Strata test"
          git config user.email "strata-test@users.noreply.github.com"
          echo "# Example app" > README.md
          git add README.md
          git commit --quiet --message "Start the app"
          echo "first=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "A small example." >> README.md
          git commit --quiet --all --message "Describe the app"
          echo "plain=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf '# Project rules\n\nRun the tests before you commit.\n' > CLAUDE.md
          printf '# Agent instructions\n\nUse pnpm, not npm.\n' > AGENTS.md
          git add CLAUDE.md AGENTS.md
          git commit --quiet --message "Add agent instructions"
          echo "configured=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: No agent configuration
        id: empty
        uses: nabondance/strata@v0
        with:
          base: ${{ steps.repo.outputs.first }}
          head: ${{ steps.repo.outputs.plain }}
      - name: Agent configuration added
        id: added
        uses: nabondance/strata@v0
        with:
          base: ${{ steps.repo.outputs.plain }}
          head: ${{ steps.repo.outputs.configured }}
          limit-up-front-tokens: 8000
      - name: Check the outputs
        shell: bash
        env:
          EMPTY_TOKENS: ${{ steps.empty.outputs.tokens }}
          EMPTY_DELTA: ${{ steps.empty.outputs.delta-tokens }}
          EMPTY_LIMIT: ${{ steps.empty.outputs.limit-result }}
          TOKENS: ${{ steps.added.outputs.tokens }}
          DELTA: ${{ steps.added.outputs.delta-tokens }}
          LIMIT: ${{ steps.added.outputs.limit-result }}
          JSON: ${{ steps.added.outputs.json-file }}
          SUMMARY: ${{ steps.added.outputs.summary-file }}
          INSTALL: ${{ steps.added.outputs.install }}
        run: |
          set -euo pipefail
          test "$EMPTY_TOKENS" = 0
          test "$EMPTY_DELTA" = 0
          test "$EMPTY_LIMIT" = none
          [[ "$TOKENS" =~ ^[1-9][0-9]*$ ]]
          test "$DELTA" = "$TOKENS"
          test "$LIMIT" = within
          test "$(jq .comparison.afterTokens "$JSON")" = "$TOKENS"
          grep --quiet "Strata configuration delta" "$SUMMARY"
          # Releases before the install output built from source; later ones use npm.
          test -z "$INSTALL" || test "$INSTALL" = npm
          echo "Added configuration: $TOKENS tokens, all within the limit; Strata from ${INSTALL:-source}."

  # This repository from a default shallow checkout, so the released Action
  # has to fetch the earlier commit itself.
  shallow-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select recent commits
        id: revisions
        shell: bash
        run: |
          echo "base=$(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Released Action
        id: strata
        uses: nabondance/strata@v0
        with:
          base: ${{ steps.revisions.outputs.base }}
          head: ${{ steps.revisions.outputs.head }}
      - name: Check the outputs and tags
        shell: bash
        env:
          TOKENS: ${{ steps.strata.outputs.tokens }}
          DELTA: ${{ steps.strata.outputs.delta-tokens }}
        run: |
          set -euo pipefail
          [[ "$TOKENS" =~ ^[1-9][0-9]*$ ]]
          [[ "$DELTA" =~ ^-?[0-9]+$ ]]
          echo "This repository: $TOKENS tokens, $DELTA change."
          # Release Please pins package.json's version in the README, and the
          # release workflow moves v0 to each release, so the two should match.
          pinned="v$(jq -r .version package.json)"
          # The commit a tag points at; an annotated tag's own ID is listed first.
          tag() {
            git ls-remote origin "refs/tags/$1" "refs/tags/$1^{}" |
              awk '{ sha = $1 } $2 ~ /\^\{\}$/ { peeled = $1 } END { print peeled ? peeled : sha }'
          }
          pinned_sha="$(tag "$pinned")"
          if [ -z "$pinned_sha" ]; then
            echo "::notice title=Strata::$pinned is not tagged yet, so whether v0 points at it is not checked."
            exit 0
          fi
          v0="$(tag v0)"
          if [ "$v0" != "$pinned_sha" ]; then
            echo "::error title=Strata::v0 is at ${v0:-nothing}, not $pinned ($pinned_sha)."
            exit 1
          fi
          echo "v0 points at $pinned."
