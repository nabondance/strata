name: Agent context image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strata-image
  cancel-in-progress: true

# Renders Strata's own history with the code on main and publishes the image
# as the single commit of the strata-image branch, which the README displays.
# Other repositories run the published package instead: see docs/ci.md.
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Render image and badge
        run: |
          node dist/cli.js analyze "$GITHUB_WORKSPACE" --format svg --output "$RUNNER_TEMP/strata-image/strata.svg" --quiet
          node dist/cli.js analyze "$GITHUB_WORKSPACE" --format badge --output "$RUNNER_TEMP/strata-image/strata-badge.json" --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strata-image
          path: ${{ runner.temp }}/strata-image/
  publish:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: strata-image
          path: strata-image
      - name: Publish to the strata-image branch
        working-directory: strata-image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b strata-image
          git add strata.svg strata-badge.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Update Strata image for $GITHUB_SHA"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:strata-image
