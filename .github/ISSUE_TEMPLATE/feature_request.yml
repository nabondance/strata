name: Feature request
description: Suggest an improvement to Strata.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user need without including private repository paths, agent instructions, prompt text, or credentials.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what Strata should do and how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What approaches have you considered?
    validations:
      required: false
