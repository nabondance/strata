name: Bug report
description: Report a reproducible problem in Strata.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include private repository paths, agent instructions, prompt text, credentials, or exploit details. See [SECURITY.md](https://github.com/nabondance/strata/blob/main/SECURITY.md) for security concerns.
  - type: input
    id: version
    attributes:
      label: Strata version or commit
      description: Include the version or commit you ran.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Strata to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Redact repository names and paths where possible.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Share the commands and a minimal synthetic example. Do not attach private repository content.
    validations:
      required: true
